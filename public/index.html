<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Биржевой аналитик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--side:#ffffff;--line:#e5e7eb;--line2:#eef0f3;--text:#111827;--text2:#374151;--muted:#6b7280;
  --accent:#4f46e5;--ok:#059669;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;
  --code:#f9fafb;--shadow:0 1px 2px rgba(16,24,40,.04);--c1:#4f46e5;--c2:#3b82f6;--c3:#10b981;--c4:#f59e0b;--c5:#ec4899;--c6:#8b5cf6;--c7:#06b6d4;
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0f1117;--panel:#171a23;--side:#141720;--line:#262b38;--line2:#1f2430;--text:#f3f4f6;--text2:#d1d5db;--muted:#9ca3af;
  --accent:#6366f1;--ok:#34d399;--ok-soft:#064e3b;--warn:#fbbf24;--warn-soft:#451a03;
  --code:#11141c;--shadow:none;--c1:#818cf8;--c2:#60a5fa;--c3:#34d399;--c4:#fbbf24;--c5:#f472b6;--c6:#a78bfa;--c7:#22d3ee;
  color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--panel:#171a23;--side:#141720;--line:#262b38;--line2:#1f2430;--text:#f3f4f6;--text2:#d1d5db;--muted:#9ca3af;
  --accent:#6366f1;--ok:#34d399;--ok-soft:#064e3b;--warn:#fbbf24;--warn-soft:#451a03;
  --code:#11141c;--shadow:none;--c1:#818cf8;--c2:#60a5fa;--c3:#34d399;--c4:#fbbf24;--c5:#f472b6;--c6:#a78bfa;--c7:#22d3ee;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.app{display:flex;min-height:100vh}
aside{width:280px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 6px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;color:var(--text2);font-size:14px;line-height:1.35}
.nav button:hover{background:var(--line2);color:var(--text)}
.nav .ic{flex:none;width:18px;height:18px;margin-top:1px;color:var(--muted)}
.side-foot{margin-top:auto}
.theme{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:500;font-size:14px;width:100%}
.theme:hover{border-color:var(--accent);color:var(--text)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
.top .m-theme{display:none;width:auto}
.wrap{max-width:1040px;width:100%;margin:0 auto;padding:28px 28px 150px}
.m-chips{display:none;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.m-chips button{border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.msg{margin:0 0 22px}
.q{background:var(--accent);color:#fff;padding:10px 16px;border-radius:14px 14px 4px 14px;margin:0 0 12px auto;max-width:80%;width:fit-content;white-space:pre-wrap;font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.a{padding:20px 22px}
.a .txt{white-space:pre-wrap;color:var(--text)}
.a .txt b{font-weight:600}
.a .li{display:block;padding-left:1.1em;text-indent:-1.1em}
.a code{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.92em}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite ease-in-out}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12.5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gray{background:var(--line2);color:var(--muted)}
.dash{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi .l{font-weight:600;font-size:13.5px;color:var(--text2)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.15;word-break:break-word}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:4px;word-break:break-word}
.chart{padding:18px 20px}
.chart h3{margin:0 0 14px;font-size:16px;font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:12px;align-items:center;font-size:13.5px}
.bar-row .nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar-row .fl{display:block;height:100%;border-radius:999px;background:var(--c1)}
.bar-row .vl{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;white-space:nowrap}
.donut{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13.5px;min-width:0}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend span{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:500}
summary:hover{color:var(--text)}
.assum{margin:10px 0;color:var(--text2)}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;color:var(--text2)}
.tbl{overflow:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
th{background:var(--code);color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.sub{color:var(--muted);font-size:12.5px}
form{position:fixed;left:280px;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 28px 18px}
.bar{max-width:1040px;margin:0 auto;display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 16px rgba(16,24,40,.06)}
.bar:focus-within{border-color:var(--accent)}
textarea{flex:1;resize:none;height:44px;border:0;outline:0;background:transparent;color:var(--text);padding:11px 10px;font:inherit}
button.send{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 18px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
button.send:disabled{opacity:.5;cursor:wait}
@media (max-width:960px){
  aside{display:none}
  form{left:0;padding:22px 16px 14px}
  .top{padding:0 16px}.top h1{font-size:16px}.top .m-theme{display:inline-flex}
  .wrap{padding:20px 16px 140px}
  .m-chips{display:flex}
  .donut{grid-template-columns:1fr}
  .donut svg{max-width:220px;margin:0 auto}
  .send .lbl{display:none}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px 14px}.kpi .v{font-size:20px}.kpi .s{font-size:11px}.chart{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i>↗</i>UZEX AI</div>
    <div>
      <div class="sec">Примеры · Misollar</div>
      <div class="nav" id="nav"></div>
    </div>
    <div class="side-foot"><button class="theme" id="theme" type="button"></button></div>
  </aside>
  <main>
    <div class="top">
      <h1>Биржевой аналитик · Birja tahlilchisi</h1>
      <button class="theme m-theme" id="theme2" type="button" aria-label="Тема"></button>
    </div>
    <div class="wrap">
      <div class="m-chips" id="chips"></div>
      <div id="log"></div>
    </div>
  </main>
</div>
<form id="f">
  <div class="bar">
    <textarea id="q" placeholder="Задайте вопрос… / Savol bering…" autofocus></textarea>
    <button class="send" id="b" type="submit"><span class="lbl">Спросить</span> <span>→</span></button>
  </div>
</form>
<script>
const EX=[
 ["Какой общий оборот биржи в 2025 году?","M3 3v18h18M7 14l4-4 4 4 5-6"],
 ["Динамика оборота биржи по годам","M3 17l6-6 4 4 8-8"],
 ["Топ-5 покупателей цемента в 2026 году","M4 20V10M10 20V4M16 20v-7M22 20H2"],
 ["Средняя цена бензина АИ-92 в сентябре 2026","M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"],
 ["Структура сделок 2024 года по статусам","M12 2a10 10 0 1 0 10 10H12z"],
 ["2025-yilda eksport bitimlari summasi qancha?","M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"],
 ["Farg‘ona viloyatida eng ko‘p sotilgan tovar qaysi?","M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"],
];
const $=id=>document.getElementById(id);
const log=$('log'),f=$('f'),q=$('q'),b=$('b');
const icon=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="${p}"/></svg>`;
EX.forEach(([t,p])=>{
  const n=document.createElement('button');n.type='button';n.innerHTML=`<span class="ic">${icon(p)}</span><span>${t}</span>`;n.onclick=()=>{q.value=t;send()};$('nav').appendChild(n);
  const c=document.createElement('button');c.type='button';c.textContent=t;c.onclick=()=>{q.value=t;send()};$('chips').appendChild(c);
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
f.addEventListener('submit',e=>{e.preventDefault();send()});
const root=document.documentElement;
const sysDark=()=>window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
const sun='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');const dark=t?t==='dark':sysDark();$('theme').innerHTML=dark?sun+' Светлая тема':moon+' Тёмная тема';$('theme2').innerHTML=dark?sun:moon}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
applyTheme(saved);
const toggle=()=>{const cur=root.getAttribute('data-theme')||(sysDark()?'dark':'light');const next=cur==='dark'?'light':'dark';applyTheme(next);try{localStorage.setItem('theme',next)}catch(e){}};
$('theme').onclick=toggle;$('theme2').onclick=toggle;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).split('\n').map(line=>{
  let l=line.replace(/^\s*#{1,6}\s+/,'');
  l=l.replace(/\*\*([^*]+?)\*\*/g,'<b>$1</b>').replace(/__([^_]+?)__/g,'<b>$1</b>').replace(/`([^`]+?)`/g,'<code>$1</code>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1$2');
  const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
  if(m){const num=l.match(/^\s*(\d+[.)])/);return '<span class="li">'+(num?num[1]+' ':'• ')+m[1]+'</span>'}
  return l;
}).join('\n').replace(/\n(<span class="li">)/g,'$1').replace(/(<\/span>)\n/g,'$1').replace(/\n{3,}/g,'\n\n');
let LANG='ru';
const full=v=>typeof v==='number'?(Number.isInteger(v)?v.toLocaleString('ru-RU'):v.toLocaleString('ru-RU',{maximumFractionDigits:2})):esc(v);
function compact(v){
  if(typeof v!=='number')return esc(v);
  const a=Math.abs(v),U=LANG==='uz'?['ming','mln','mlrd','trln']:LANG==='uz_cyr'?['минг','млн','млрд','трлн']:['тыс','млн','млрд','трлн'];
  for(const [d,u] of [[1e12,U[3]],[1e9,U[2]],[1e6,U[1]]]) if(a>=d) return (v/d).toLocaleString('ru-RU',{maximumFractionDigits:a/d>=100?0:2})+' '+u;
  return full(v);
}
const isId=c=>/(^|_)(inn|stir|id|code|kod)$/i.test(c);
const fmtCell=(c,v)=>typeof v==='number'&&(isId(c)||/year|yil/i.test(c))?String(v):full(v);
const COLORS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7'].map(c=>`var(${c})`);
function barChart(ch){
  const pts=ch.points.slice(0,12),mx=Math.max(...pts.map(p=>Math.abs(p[1])))||1;
  return '<div class="bars">'+pts.map((p,i)=>`<div class="bar-row"><span class="nm" title="${esc(p[0])}">${esc(p[0])}</span><span class="tr"><span class="fl" style="width:${Math.max(2,Math.abs(p[1])/mx*100)}%;opacity:${1-Math.min(i,8)*0.06}"></span></span><span class="vl" title="${full(p[1])}">${compact(p[1])}</span></div>`).join('')+'</div>';
}
function lineChart(ch){
  const pts=ch.points,W=Math.max(340,Math.min(760,(log.clientWidth||760)-60)),H=W<500?220:260,L=W<500?58:70,R=22,T=14,B=30;
  const ys=pts.map(p=>p[1]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn>0&&mn/mx<0.6)mn=0;if(mx===mn){mx+=1;mn-=1}
  const x=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const P=pts.map((p,i)=>[x(i),y(p[1])]);
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
  let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,yy=y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`}
  const step=Math.ceil(pts.length/10);let xl='';pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)xl+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(p[0])}</text>`});
  const area=d+` L${P[P.length-1][0]},${H-B} L${P[0][0]},${H-B} Z`,gid='g'+Math.random().toString(36).slice(2,8);
  const dots=P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--panel)" stroke="var(--c1)" stroke-width="2"><title>${esc(pts[i][0])}: ${full(pts[i][1])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".18"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="var(--c1)" stroke-width="2.5"/>${dots}${xl}</svg>`;
}
function donutChart(ch){
  const pts=ch.points.filter(p=>p[1]>0),tot=pts.reduce((s,p)=>s+p[1],0)||1,R=80,C=2*Math.PI*R;let off=0;
  const segs=pts.map((p,i)=>{const len=p[1]/tot*C;const s=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${COLORS[i%7]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(p[0])}: ${full(p[1])}</title></circle>`;off+=len;return s}).join('');
  const leg=pts.map((p,i)=>`<div><i style="background:${COLORS[i%7]}"></i><span title="${esc(p[0])}">${esc(p[0])}</span><b title="${full(p[1])}">${compact(p[1])} · ${(p[1]/tot*100).toLocaleString('ru-RU',{maximumFractionDigits:1})}%</b></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 200 200">${segs}<text x="100" y="98" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--text)">${compact(tot)}</text><text x="100" y="120" text-anchor="middle" class="ax" style="font-size:12px">${esc(ch.y_label||'')}</text></svg><div class="legend">${leg}</div></div>`;
}
function dashboard(d){
  if(!d)return '';
  let h='<div class="dash">';
  if(d.kpis&&d.kpis.length) h+='<div class="kpis">'+d.kpis.map(k=>`<div class="card kpi"><div class="l">${esc(k.label)}</div><div class="v" title="${full(k.value)}">${compact(k.value)}</div><div class="s">${Math.abs(k.value)>=1e6?full(k.value):'&nbsp;'}</div></div>`).join('')+'</div>';
  if(d.chart){const c=d.chart;h+=`<div class="card chart">${c.title?`<h3>${esc(c.title)}</h3>`:''}${c.type==='line'?lineChart(c):c.type==='donut'?donutChart(c):barChart(c)}${c.y_label&&c.type!=='donut'?`<div class="sub" style="margin-top:8px">${esc(c.y_label)}</div>`:''}</div>`}
  return h+'</div>';
}
async function send(){
  const text=q.value.trim(); if(!text||b.disabled) return;
  q.value=''; b.disabled=true;
  const m=document.createElement('div');m.className='msg';
  m.innerHTML=`<div class="q">${esc(text)}</div><div class="card a"><div class="thinking"><span class="dot"></span><span class="tt">Считаю по данным… 0 с</span></div></div>`;
  log.appendChild(m); m.scrollIntoView({behavior:'smooth',block:'end'});
  const a=m.querySelector('.a'),tt=m.querySelector('.tt'),t0=Date.now();
  const tm=setInterval(()=>tt.textContent='Считаю по данным… '+Math.round((Date.now()-t0)/1000)+' с',500);
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
    const d=await r.json(); clearInterval(tm);
    LANG=d.lang||'ru';
    const uz=LANG.startsWith('uz'),cyr=LANG==='uz_cyr';
    const L=cyr?{basis:'Нимага асосланган',assum:'Шартлар',q:'SQL сўров',rows:'қатор',ver:'Маълумотлар билан тасдиқланган',unver:'Тасдиқланмаган',nod:'Маълумот йўқ',s:'с'}
      :uz?{basis:'Nimaga asoslangan',assum:'Shartlar',q:'SQL so‘rov',rows:'qator',ver:'Maʼlumotlar bilan tasdiqlangan',unver:'Tasdiqlanmagan',nod:'Maʼlumot yoʻq',s:'s'}
      :{basis:'На чём основано',assum:'Условия',q:'SQL-запрос',rows:'строк',ver:'Проверено по данным',unver:'Не подтверждено',nod:'Нет данных',s:'с'};
    let h=`<div class="txt">${md(d.answer||d.error||'Ошибка')}</div>`;
    h+=dashboard(d.dashboard);
    h+='<div class="meta">'+(d.verified?`<span class="pill ok">✓ ${L.ver}</span>`:`<span class="pill warn">${L.unver}</span>`)+(d.no_data?`<span class="pill gray">${L.nod}</span>`:'')+`<span>${d.elapsed_s??''} ${L.s}</span></div>`;
    if((d.queries&&d.queries.length)||d.assumptions){
      h+=`<details><summary>${L.basis}</summary>`;
      if(d.assumptions) h+=`<div class="assum"><b>${L.assum}:</b> ${md(d.assumptions)}</div>`;
      (d.queries||[]).forEach((x,i)=>{
        h+=`<div style="margin-top:10px"><b>${L.q} ${i+1}</b>${x.purpose?' — '+esc(x.purpose):''}</div><pre>${esc(x.sql)}</pre>`;
        if(x.rows&&x.rows.length){h+='<div class="tbl"><table><tr>'+x.columns.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>'+x.rows.slice(0,10).map(r=>'<tr>'+r.map((v,j)=>`<td>${fmtCell(x.columns[j],v)}</td>`).join('')+'</tr>').join('')+'</table></div>'+(x.row_count>10?`<div class="sub">… ${x.row_count}${x.truncated?'+':''} ${L.rows}</div>`:'')}
      });
      h+='</details>';
    }
    a.innerHTML=h;
  }catch(e){clearInterval(tm);a.innerHTML='<div class="txt">Сервис недоступен, попробуйте ещё раз.</div>'}
  b.disabled=false; q.focus();
}
</script>
</body>
</html>
